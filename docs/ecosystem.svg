<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" />
    </pattern>
    <rect width="960" height="560" fill="url(#grid)" />
  </g>

  <!-- Header Section -->
  <text x="480" y="44" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">
    Komari Emerald Ecosystem
  </text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
    Coordinated Theme &amp; Plugin Architecture for Komari Monitor
  </text>

  <!-- Connection Paths -->
  <!-- Komari Server -> Availability History -->
  <path d="M 400 135 C 280 135, 220 160, 220 200" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <!-- Komari Server -> IPQA Alert Report -->
  <path d="M 560 135 C 680 135, 740 160, 740 200" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- VPS IP-Quality-Archive -> IPQA Alert Report -->
  <path d="M 740 375 L 740 305" fill="none" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Availability History -> Komari Emerald -->
  <path d="M 220 305 C 220 370, 360 410, 400 425" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- IPQA Alert Report -> Komari Emerald -->
  <path d="M 700 305 C 660 370, 600 410, 560 425" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- Komari Server direct to Emerald -->
  <path d="M 480 155 L 480 395" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- 1. Top Card: Komari Server -->
  <g transform="translate(360, 95)" filter="url(#shadow)">
    <rect width="240" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="url(#blue-grad)" />
    <path d="M 23 27 L 33 27 M 28 22 L 28 32 M 23 33 L 33 33" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="54" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Komari Server</text>
    <text x="54" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Core Monitoring Daemon &amp; RPC</text>
  </g>

  <!-- 2. Middle Left Card: Availability History Plugin -->
  <g transform="translate(80, 205)" filter="url(#shadow)">
    <rect width="280" height="95" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#emerald-grad)" />
    <circle cx="28" cy="32" r="14" fill="url(#emerald-grad)" />
    <path d="M 22 32 L 26 36 L 34 27" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="52" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Availability History</text>
    <rect x="182" y="16" width="86" height="18" rx="9" fill="#10b981" fill-opacity="0.15" />
    <text x="225" y="29" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">KOMARI PLUGIN</text>
    <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• WebSocket live event ledger</text>
    <text x="20" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• 30-day exact uptime calculation</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• No CPU-sampling inference errors</text>
  </g>

  <!-- 3. Middle Right Card: IPQA Alert Report Plugin -->
  <g transform="translate(600, 205)" filter="url(#shadow)">
    <rect width="280" height="95" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" />
    <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#purple-grad)" />
    <circle cx="28" cy="32" r="14" fill="url(#purple-grad)" />
    <path d="M 28 22 L 34 25 L 34 33 C 34 37 28 40 28 40 C 28 40 22 37 22 33 L 22 25 Z" fill="none" stroke="#ffffff" stroke-width="1.8" />
    <text x="52" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">IPQA Alert Report</text>
    <rect x="182" y="16" width="86" height="18" rx="9" fill="#8b5cf6" fill-opacity="0.15" />
    <text x="225" y="29" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">KOMARI PLUGIN</text>
    <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Incremental archive synchronization</text>
    <text x="20" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Read-only versioned REST API</text>
    <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Semantic diff &amp; daily aggregated alerts</text>
  </g>

  <!-- 4. Bottom Right Sub-card: IP-Quality-Archive on VPS -->
  <g transform="translate(620, 380)" filter="url(#shadow)">
    <rect width="240" height="64" rx="10" fill="#1e293b" stroke="#be185d" stroke-width="1.2" stroke-dasharray="3,3" />
    <circle cx="24" cy="32" r="11" fill="url(#rose-grad)" />
    <path d="M 19 32 L 29 32 M 24 27 L 24 37" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <text x="44" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">IP-Quality-Archive</text>
    <rect x="156" y="14" width="72" height="16" rx="8" fill="#ec4899" fill-opacity="0.15" />
    <text x="192" y="25" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600">VPS AGENT</text>
    <text x="44" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Installed on Monitored VPS Nodes</text>
    <text x="44" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Runs Daily 04:00 AM Quality Check</text>
  </g>

  <!-- 5. Bottom Center Flagship Card: Komari Emerald Theme -->
  <g transform="translate(240, 400)" filter="url(#shadow)">
    <rect width="480" height="110" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="480" height="5" rx="2" fill="url(#emerald-grad)" />
    <circle cx="34" cy="38" r="16" fill="url(#emerald-grad)" filter="url(#glow-emerald)" />
    <path d="M 28 38 L 32 42 L 40 33" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">Komari Emerald</text>
    <rect x="360" y="20" width="102" height="22" rx="11" fill="#10b981" fill-opacity="0.2" />
    <text x="411" y="35" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">FLAGSHIP THEME</text>
    <text x="60" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Modern Dashboard • Resource Insights • Traffic Trends • Exact 30d Uptime • IPQA</text>
    <line x1="20" y1="64" x2="460" y2="64" stroke="#334155" stroke-width="1" />
    <!-- Three pill features -->
    <g transform="translate(20, 74)">
      <rect width="136" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="68" y="16" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">⚡ 7/30d Traffic Trends</text>
    </g>
    <g transform="translate(170, 74)">
      <rect width="136" height="24" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="68" y="16" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">🛡️ 30d Exact Availability</text>
    </g>
    <g transform="translate(320, 74)">
      <rect width="140" height="24" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1" />
      <text x="70" y="16" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">🌐 IPQA &amp; Cost Analytics</text>
    </g>
  </g>

  <!-- Footer Tagline -->
  <text x="480" y="540" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
    Ecosystem Design: Independent Codebases • First-Class Integration • Graceful Degradation
  </text>
</svg>
